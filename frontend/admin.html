<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Reporting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
<div id="toasts"></div>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Reporting
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload
      </a>
      <a href="reports.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Mes rapports
      </a>
      <a href="history.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4M3 21v-6h6"/></svg>
        Historique
      </a>
      <a href="profile.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profil
      </a>
      <a href="admin.html" id="nav-admin" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Admin
      </a>
    </div>
    <div class="nav-right">
      <div class="nav-user">
        <div class="avatar" id="nav-avatar">?</div>
        <div>
          <div class="nav-username" id="nav-name">—</div>
          <div class="nav-role" id="nav-role"></div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Déconnexion
      </button>
    </div>
  </div>
</nav>

<main class="page-main">
<div class="container">

  <div class="page-header flex items-center justify-between" style="flex-wrap:wrap;gap:.75rem">
    <div>
      <h1>Administration</h1>
      <p>Tableau de bord système et gestion des utilisateurs.</p>
    </div>
    <div class="flex gap-2">
      <select id="stat-days" class="form-control" style="max-width:160px" onchange="loadStats()">
        <option value="7">7 derniers jours</option>
        <option value="30" selected>30 derniers jours</option>
        <option value="90">90 derniers jours</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="loadAll()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.97"/></svg>
        Actualiser
      </button>
    </div>
  </div>

  <!-- ===== STAT CARDS ===== -->
  <div class="grid-4" style="margin-bottom:1.5rem" id="stat-cards">
    <div class="stat-card"><div class="stat-label">Chargement…</div><div class="stat-val">—</div></div>
    <div class="stat-card"><div class="stat-label">Chargement…</div><div class="stat-val">—</div></div>
    <div class="stat-card"><div class="stat-label">Chargement…</div><div class="stat-val">—</div></div>
    <div class="stat-card"><div class="stat-label">Chargement…</div><div class="stat-val">—</div></div>
  </div>

  <div class="grid-2" style="margin-bottom:1.5rem;align-items:start">

    <!-- Recent activity -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Activité récente</span>
      </div>
      <div id="recent-activity" style="padding:.5rem 0">
        <div class="spinner-center"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Top users -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Top utilisateurs</span>
      </div>
      <div id="top-users" style="padding:.5rem 0">
        <div class="spinner-center"><div class="spinner"></div></div>
      </div>
    </div>

  </div>

  <!-- ===== USER MANAGEMENT ===== -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Utilisateurs
      </span>
    </div>

    <!-- User filters -->
    <div style="padding:.875rem 1.25rem;border-bottom:1px solid var(--border);display:flex;gap:.75rem;flex-wrap:wrap">
      <input id="u-search" type="text" class="form-control" style="max-width:240px"
             placeholder="Rechercher…" oninput="debounceUsers()">
      <select id="u-active" class="form-control" style="max-width:140px" onchange="loadUsers()">
        <option value="">Tous</option>
        <option value="true">Actifs</option>
        <option value="false">Inactifs</option>
      </select>
      <select id="u-super" class="form-control" style="max-width:150px" onchange="loadUsers()">
        <option value="">Tous les rôles</option>
        <option value="true">Admins</option>
        <option value="false">Utilisateurs</option>
      </select>
    </div>

    <div class="card-body" style="padding:0">
      <div id="users-table">
        <div class="spinner-center"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="card-footer" style="justify-content:space-between">
      <span class="text-sm text-muted" id="u-info"></span>
      <div class="pagination" id="u-pagination"></div>
    </div>
  </div>

</div>
</main>

<!-- MODAL: edit user -->
<div class="modal-back hidden" id="edit-modal">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="edit-modal-title">Modifier l'utilisateur</span>
      <button class="modal-x" onclick="closeEditModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-user-id">
      <div class="form-group">
        <label class="form-label">Service</label>
        <input id="edit-dept" type="text" class="form-control" placeholder="Comptabilité">
      </div>
      <div class="form-group">
        <label class="form-label">Poste</label>
        <input id="edit-job" type="text" class="form-control" placeholder="Analyste">
      </div>
      <div style="display:flex;gap:1.5rem;margin-top:.25rem">
        <label style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;cursor:pointer">
          <input type="checkbox" id="edit-active"> Compte actif
        </label>
        <label style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;cursor:pointer">
          <input type="checkbox" id="edit-super"> Administrateur
        </label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeEditModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveUser()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const adminState = { userPage: 1, userPages: 1, debounce: null };

document.addEventListener('DOMContentLoaded', () => {
  if (!requireAdmin()) return;
  initNav();
  loadAll();
});

function loadAll() { loadStats(); loadRecentActivity(); loadTopUsers(); loadUsers(); }

/* ===== STATS ===== */
async function loadStats() {
  const days = document.getElementById('stat-days').value;
  try {
    const d = await apiJSON(`/admin/dashboard/stats?days=${days}`);
    if (!d) return;

    const cards = [
      { label:'Utilisateurs actifs', val: d.users?.active ?? '—',      sub: `${d.users?.total ?? 0} au total`,        color:'#dbeafe', iconColor:'#2563eb',
        icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>` },
      { label:'Fichiers importés',   val: d.files?.total ?? '—',       sub: d.files?.total_size_human ?? '',           color:'#dcfce7', iconColor:'#16a34a',
        icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>` },
      { label:'Taux de succès',      val: (d.processings?.success_rate_percentage ?? 0) + '%', sub: `${d.processings?.total ?? 0} traitements`, color:'#cffafe', iconColor:'#0891b2',
        icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>` },
      { label:'Stockage utilisé',    val: d.storage?.used_human ?? '—', sub: `${d.storage?.used_percent ?? 0}% de ${d.storage?.limit_human ?? ''}`, color:'#fef3c7', iconColor:'#d97706',
        icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>` },
    ];

    document.getElementById('stat-cards').innerHTML = cards.map(c => `
      <div class="stat-card flex justify-between items-start">
        <div>
          <div class="stat-label">${c.label}</div>
          <div class="stat-val">${c.val}</div>
          <div class="stat-sub">${c.sub}</div>
        </div>
        <div class="stat-icon" style="background:${c.color};color:${c.iconColor}">${c.icon}</div>
      </div>`).join('');
  } catch (err) { Toast.error('Stats: ' + err.message); }
}

/* ===== RECENT ACTIVITY ===== */
async function loadRecentActivity() {
  try {
    const items = await apiJSON('/admin/dashboard/recent-activity?limit=8');
    if (!items) return;

    if (!items.length) {
      document.getElementById('recent-activity').innerHTML = '<div class="empty"><h3>Aucune activité</h3></div>';
      return;
    }
    document.getElementById('recent-activity').innerHTML =
      items.map(it => `
      <div style="display:flex;align-items:center;gap:.75rem;padding:.6rem 1.25rem;border-bottom:1px solid var(--border)">
        <div style="min-width:0;flex:1">
          <div style="font-size:.875rem;font-weight:500;color:var(--text)">${it.filename || '—'}</div>
          <div style="font-size:.75rem;color:var(--text-muted)">${it.user?.username || 'Anonyme'} · ${fmtRelative(it.created_at)}</div>
        </div>
        <div>${actionBadge(it.action)} ${statusBadge(it.status)}</div>
      </div>`).join('');
  } catch (err) { Toast.error('Activité: ' + err.message); }
}

/* ===== TOP USERS ===== */
async function loadTopUsers() {
  try {
    const users = await apiJSON('/admin/dashboard/top-users?limit=6');
    if (!users) return;

    if (!users.length) {
      document.getElementById('top-users').innerHTML = '<div class="empty"><h3>Aucun utilisateur</h3></div>';
      return;
    }
    document.getElementById('top-users').innerHTML =
      users.map((u, i) => `
      <div style="display:flex;align-items:center;gap:.875rem;padding:.6rem 1.25rem;border-bottom:1px solid var(--border)">
        <span style="width:22px;text-align:center;font-size:.8125rem;color:var(--text-muted);font-weight:600">#${i+1}</span>
        <div class="avatar" style="width:32px;height:32px;font-size:.75rem">${(u.full_name||u.username||'?')[0].toUpperCase()}</div>
        <div style="min-width:0;flex:1">
          <div style="font-weight:500;font-size:.875rem">${u.full_name || u.username}</div>
          <div style="font-size:.75rem;color:var(--text-muted)">${u.email}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:600;font-size:.9375rem">${u.total_actions}</div>
          <div style="font-size:.75rem;color:var(--text-muted)">actions</div>
        </div>
      </div>`).join('');
  } catch (err) { Toast.error('Top users: ' + err.message); }
}

/* ===== USERS TABLE ===== */
function debounceUsers() {
  clearTimeout(adminState.debounce);
  adminState.debounce = setTimeout(loadUsers, 400);
}

async function loadUsers(page = 1) {
  adminState.userPage = page;
  document.getElementById('users-table').innerHTML =
    '<div class="spinner-center"><div class="spinner"></div></div>';

  const params = new URLSearchParams({ page, limit: 15 });
  const search = document.getElementById('u-search').value.trim();
  const active = document.getElementById('u-active').value;
  const sup    = document.getElementById('u-super').value;
  if (search) params.set('search', search);
  if (active) params.set('is_active', active);
  if (sup)    params.set('is_superuser', sup);

  try {
    const data = await apiJSON(`/admin/users?${params}`);
    if (!data) return;
    adminState.userPages = data.pages || 1;

    document.getElementById('u-info').textContent =
      `${data.total} utilisateur${data.total > 1 ? 's' : ''}`;

    if (!data.items?.length) {
      document.getElementById('users-table').innerHTML =
        '<div class="empty"><h3>Aucun utilisateur trouvé</h3></div>';
      renderUserPagination(data);
      return;
    }

    document.getElementById('users-table').innerHTML = `
      <div class="table-wrap" style="border:none;border-radius:0">
        <table>
          <thead><tr>
            <th>Utilisateur</th><th>Email</th><th>Service</th><th>Rôle</th>
            <th>Actions</th><th>Dernière activité</th><th>Statut</th><th></th>
          </tr></thead>
          <tbody>
            ${data.items.map(u => `
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:.625rem">
                  <div class="avatar" style="width:28px;height:28px;font-size:.7rem">${(u.full_name||u.username||'?')[0].toUpperCase()}</div>
                  <div>
                    <div class="td-main">${u.full_name || u.username}</div>
                    <div style="font-size:.75rem;color:var(--text-muted)">@${u.username}</div>
                  </div>
                </div>
              </td>
              <td class="text-sm text-sec">${u.email}</td>
              <td class="text-sm text-muted">${u.department || '—'}</td>
              <td>${u.is_superuser ? '<span class="badge badge-primary">Admin</span>' : '<span class="badge badge-secondary">User</span>'}</td>
              <td class="text-sm text-sec" style="text-align:center">${u.actions_count ?? 0}</td>
              <td class="text-xs text-muted">${fmtRelative(u.last_activity)}</td>
              <td>${u.is_active ? '<span class="badge badge-success">Actif</span>' : '<span class="badge badge-danger">Inactif</span>'}</td>
              <td>
                <div class="td-actions">
                  <button class="btn btn-secondary btn-sm" onclick="openEditModal(${JSON.stringify(u).replace(/"/g,'&quot;')})">
                    Modifier
                  </button>
                  <button class="btn btn-danger btn-sm" onclick="deleteUser('${u.id}','${u.username}')">
                    Supprimer
                  </button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;

    renderUserPagination(data);
  } catch (err) {
    document.getElementById('users-table').innerHTML =
      `<div class="alert alert-danger" style="margin:1rem">${err.message}</div>`;
  }
}

function renderUserPagination(data) {
  if (data.pages <= 1) { document.getElementById('u-pagination').innerHTML = ''; return; }
  let html = `<button class="page-btn" ${data.page <= 1 ? 'disabled' : ''}
    onclick="loadUsers(${data.page - 1})">‹</button>`;
  const s = Math.max(1, data.page - 2), e = Math.min(data.pages, data.page + 2);
  for (let i = s; i <= e; i++) {
    html += `<button class="page-btn${i === data.page ? ' active' : ''}"
      onclick="loadUsers(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" ${data.page >= data.pages ? 'disabled' : ''}
    onclick="loadUsers(${data.page + 1})">›</button>`;
  document.getElementById('u-pagination').innerHTML = html;
}

/* ===== EDIT USER ===== */
function openEditModal(u) {
  document.getElementById('edit-user-id').value = u.id;
  document.getElementById('edit-modal-title').textContent = `Modifier : ${u.full_name || u.username}`;
  document.getElementById('edit-dept').value   = u.department || '';
  document.getElementById('edit-job').value    = u.job_title  || '';
  document.getElementById('edit-active').checked = !!u.is_active;
  document.getElementById('edit-super').checked  = !!u.is_superuser;
  document.getElementById('edit-modal').classList.remove('hidden');
}

function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

async function saveUser() {
  const id = document.getElementById('edit-user-id').value;
  const payload = {
    is_active:    document.getElementById('edit-active').checked,
    is_superuser: document.getElementById('edit-super').checked,
  };
  const dept = document.getElementById('edit-dept').value.trim();
  const job  = document.getElementById('edit-job').value.trim();
  if (dept) payload.department = dept;
  if (job)  payload.job_title  = job;

  const params = new URLSearchParams(payload).toString();
  try {
    await apiJSON(`/admin/users/${id}?${params}`, { method: 'PUT' });
    Toast.success('Utilisateur mis à jour.');
    closeEditModal();
    loadUsers(adminState.userPage);
  } catch (err) { Toast.error(err.message); }
}

async function deleteUser(id, username) {
  if (!confirm(`Supprimer définitivement "${username}" et toutes ses données ?`)) return;
  try {
    await apiJSON(`/admin/users/${id}`, { method: 'DELETE' });
    Toast.success(`Utilisateur "${username}" supprimé.`);
    loadUsers(adminState.userPage);
  } catch (err) { Toast.error(err.message); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditModal(); });
</script>
</body>
</html>
