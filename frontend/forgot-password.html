<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Reporting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/app.js" defer></script>
</head>
<body>
<div id="toasts"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Reporting
      </div>
    </div>

    <h2>Mot de passe oublié</h2>
    <p class="auth-sub">Saisissez votre email pour recevoir un lien de réinitialisation</p>

    <!-- Message de succès -->
    <div id="sent-box" class="alert alert-success hidden" style="margin-bottom:1rem;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>Si un compte existe pour cet email, un lien de réinitialisation vient d'être envoyé. Vérifiez votre boîte (et les spams). Le lien est valable 30 minutes.</span>
    </div>

    <div id="err-box" class="alert alert-danger hidden" style="margin-bottom:1rem;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="err-msg"></span>
    </div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Adresse email <span class="req">*</span></label>
        <input id="email" name="email" type="email" class="form-control" placeholder="vous@example.com" autocomplete="email" required>
      </div>
      <button id="submit-btn" type="submit" class="btn btn-primary w-full btn-lg" style="margin-top:.5rem">
        <span id="submit-label">Envoyer le lien</span>
        <span id="submit-spin" class="spinner hidden" style="width:18px;height:18px;border-width:2px;border-color:rgba(255,255,255,.3);border-top-color:#fff;"></span>
      </button>
    </form>

    <div class="auth-footer">
      <a href="login.html">← Retour à la connexion</a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('forgot-form');
  const btn  = document.getElementById('submit-btn');
  const lbl  = document.getElementById('submit-label');
  const spin = document.getElementById('submit-spin');
  const sent = document.getElementById('sent-box');
  const errBox = document.getElementById('err-box');
  const errMsg = document.getElementById('err-msg');

  function loading(v) {
    btn.disabled = v;
    lbl.textContent = v ? 'Envoi…' : 'Envoyer le lien';
    spin.classList.toggle('hidden', !v);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errBox.classList.add('hidden');
    sent.classList.add('hidden');
    loading(true);

    const payload = {
      email: document.getElementById('email').value.trim(),
      reset_base_url: window.location.origin + '/reset-password.html',
    };

    try {
      const res = await fetch(`${API}/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(fmtApiError(d));
      }
      sent.classList.remove('hidden');
      form.reset();
    } catch (err) {
      errMsg.textContent = err instanceof TypeError
        ? 'Impossible de joindre le serveur.'
        : (err.message || 'Erreur inconnue.');
      errBox.classList.remove('hidden');
    } finally {
      loading(false);
    }
  });
});
</script>
</body>
</html>
