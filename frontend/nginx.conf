# =========================================================================
#  Reporting — configuration nginx (HTTPS)
#  - Termine le TLS sur le 443 avec le certificat interne
#  - Redirige tout le HTTP (80) vers HTTPS
#  - Sert le frontend statique + relaie l'API backend sur la même origine
#    (/api -> backend:8000), ce qui évite tout problème de "mixed content".
# =========================================================================

# --- HTTPS — frontend (app) : servi sur 8080 (port visible dans l'URL) ---
server {
    listen       8080 ssl;
    http2        on;
    server_name  reporting-demo.example.com;

    # Certificat interne (cert serveur + chaîne) et clé privée (montés via volume)
    ssl_certificate     /certs/reporting-demo.example.com.fullchain.pem;
    ssl_certificate_key /certs/reporting-demo.example.com.key;

    # Réglages TLS modernes
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # Requête HTTP en clair envoyée à ce port HTTPS → redirige vers le même
    # port en HTTPS (ex. http://hôte:8080 → https://hôte:8080).
    error_page 497 =301 https://$host:$server_port$request_uri;

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root   /usr/share/nginx/html;
    index  login.html index.html;

    # --- API : relais vers le backend (même origine, pas de mixed content) ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;        # autoriser l'upload de gros fichiers Excel
        proxy_read_timeout   300s;       # génération/envoi de rapports longs
        proxy_connect_timeout 30s;
    }

    # --- Documentation interactive de l'API (Swagger /docs, ReDoc, openapi.json)
    #     servie via la même origine HTTPS (réutilise le certificat TLS) ---
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pas de cache sur le HTML (toujours la dernière version)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Cache court pour CSS/JS
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# --- HTTPS direct vers le BACKEND (port 8000 visible dans l'URL) ---
#  Termine le TLS avec le même certificat et relaie tout vers le backend.
#  → https://<hôte>:8000/docs, /api/v1/…  (la clé privée reste côté nginx)
server {
    listen       8000 ssl;
    http2        on;
    server_name  reporting-demo.example.com;

    ssl_certificate     /certs/reporting-demo.example.com.fullchain.pem;
    ssl_certificate_key /certs/reporting-demo.example.com.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # http://hôte:8000 (en clair) → https://hôte:8000
    error_page 497 =301 https://$host:$server_port$request_uri;

    add_header X-Content-Type-Options "nosniff" always;

    # La racine du port backend mène directement à la doc Swagger.
    #  http://hôte:8000  → (497) https://hôte:8000/  → https://hôte:8000/docs
    location = / {
        return 301 https://$host:$server_port/docs;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout   300s;
        proxy_connect_timeout 30s;
    }
}
