<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe — Reporting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/app.js" defer></script>
</head>
<body>
<div id="toasts"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Reporting
      </div>
    </div>

    <h2>Nouveau mot de passe</h2>
    <p class="auth-sub">Choisissez un nouveau mot de passe pour votre compte</p>

    <!-- Token manquant -->
    <div id="no-token" class="alert alert-danger hidden" style="margin-bottom:1rem;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>Lien invalide : aucun token fourni. Refaites une demande de réinitialisation.</span>
    </div>

    <!-- Succès -->
    <div id="ok-box" class="alert alert-success hidden" style="margin-bottom:1rem;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>Mot de passe réinitialisé ! Redirection vers la connexion…</span>
    </div>

    <!-- Erreur -->
    <div id="err-box" class="alert alert-danger hidden" style="margin-bottom:1rem;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="err-msg"></span>
    </div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="pw">Nouveau mot de passe <span class="req">*</span></label>
        <input id="pw" type="password" class="form-control" placeholder="••••••••" autocomplete="new-password" required>
        <p class="form-hint">Au moins 8 caractères, 1 majuscule, 1 chiffre.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="pw2">Confirmer <span class="req">*</span></label>
        <input id="pw2" type="password" class="form-control" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <button id="submit-btn" type="submit" class="btn btn-primary w-full btn-lg" style="margin-top:.5rem">
        <span id="submit-label">Réinitialiser</span>
        <span id="submit-spin" class="spinner hidden" style="width:18px;height:18px;border-width:2px;border-color:rgba(255,255,255,.3);border-top-color:#fff;"></span>
      </button>
    </form>

    <div class="auth-footer">
      <a href="login.html">← Retour à la connexion</a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const token = new URLSearchParams(window.location.search).get('token');
  const form = document.getElementById('reset-form');

  if (!token) {
    document.getElementById('no-token').classList.remove('hidden');
    form.style.display = 'none';
    return;
  }

  const btn  = document.getElementById('submit-btn');
  const lbl  = document.getElementById('submit-label');
  const spin = document.getElementById('submit-spin');
  const okBox = document.getElementById('ok-box');
  const errBox = document.getElementById('err-box');
  const errMsg = document.getElementById('err-msg');

  function loading(v) {
    btn.disabled = v;
    lbl.textContent = v ? 'Traitement…' : 'Réinitialiser';
    spin.classList.toggle('hidden', !v);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errBox.classList.add('hidden');

    const pw  = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw !== pw2) {
      errMsg.textContent = 'Les mots de passe ne correspondent pas.';
      errBox.classList.remove('hidden');
      return;
    }

    loading(true);
    try {
      const res = await fetch(`${API}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: pw }),
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(fmtApiError(d));
      }
      form.style.display = 'none';
      okBox.classList.remove('hidden');
      setTimeout(() => window.location.href = 'login.html', 2000);
    } catch (err) {
      errMsg.textContent = err instanceof TypeError
        ? 'Impossible de joindre le serveur.'
        : (err.message || 'Erreur inconnue.');
      errBox.classList.remove('hidden');
      loading(false);
    }
  });
});
</script>
</body>
</html>
