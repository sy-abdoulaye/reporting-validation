<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Reporting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
<div id="toasts"></div>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:520px">
    <div class="auth-logo">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Reporting
      </div>
    </div>

    <h2>Créer un compte</h2>
    <p class="auth-sub">Remplissez les informations ci-dessous</p>

    <div id="reg-error" class="alert alert-danger hidden" style="margin-bottom:1rem;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="reg-error-msg"></span>
    </div>

    <form id="reg-form" novalidate>
      <div class="grid-2" style="gap:1rem">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="r-email">Email <span class="req">*</span></label>
          <input id="r-email" name="email" type="email" class="form-control" placeholder="vous@exemple.com" required>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="r-username">Nom d'utilisateur <span class="req">*</span></label>
          <input id="r-username" name="username" type="text" class="form-control" placeholder="jean_dupont" required>
        </div>
      </div>

      <div class="form-group" style="margin-top:1rem">
        <label class="form-label" for="r-fullname">Nom complet</label>
        <input id="r-fullname" name="full_name" type="text" class="form-control" placeholder="Jean Dupont">
      </div>

      <div class="grid-2" style="gap:1rem">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="r-dept">Service / Département</label>
          <input id="r-dept" name="department" type="text" class="form-control" placeholder="Comptabilité">
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="r-job">Poste</label>
          <input id="r-job" name="job_title" type="text" class="form-control" placeholder="Analyste">
        </div>
      </div>

      <div class="form-group" style="margin-top:1rem">
        <label class="form-label" for="r-password">Mot de passe <span class="req">*</span></label>
        <input id="r-password" name="password" type="password" class="form-control" placeholder="••••••••" required>
        <p class="form-hint">Au moins 8 caractères, 1 majuscule, 1 chiffre.</p>
      </div>

      <button id="reg-btn" type="submit" class="btn btn-primary w-full btn-lg" style="margin-top:.25rem">
        <span id="reg-label">Créer le compte</span>
        <span id="reg-spin" class="spinner hidden" style="width:18px;height:18px;border-width:2px;border-color:rgba(255,255,255,.3);border-top-color:#fff;"></span>
      </button>
    </form>

    <div class="auth-footer">
      Déjà un compte ? <a href="login.html">Se connecter</a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  requireGuest();

  const form   = document.getElementById('reg-form');
  const errBox = document.getElementById('reg-error');
  const errMsg = document.getElementById('reg-error-msg');
  const btn    = document.getElementById('reg-btn');
  const lbl    = document.getElementById('reg-label');
  const spin   = document.getElementById('reg-spin');

  function setLoading(v) {
    btn.disabled = v;
    lbl.textContent = v ? 'Création…' : 'Créer le compte';
    spin.classList.toggle('hidden', !v);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errBox.classList.add('hidden');

    const payload = {
      email:      document.getElementById('r-email').value.trim(),
      username:   document.getElementById('r-username').value.trim(),
      password:   document.getElementById('r-password').value,
      full_name:  document.getElementById('r-fullname').value.trim() || undefined,
      department: document.getElementById('r-dept').value.trim() || undefined,
      job_title:  document.getElementById('r-job').value.trim() || undefined,
    };

    setLoading(true);
    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        errMsg.textContent = fmtApiError(data);
        errBox.classList.remove('hidden');
        return;
      }
      Toast.success('Compte créé ! Connectez-vous.');
      setTimeout(() => window.location.href = 'login.html', 1200);
    } catch (err) {
      errMsg.textContent = err instanceof TypeError
        ? 'Impossible de joindre le serveur. Vérifiez que le backend tourne sur le port 8000.'
        : (err.message || 'Erreur inconnue.');
      errBox.classList.remove('hidden');
    } finally {
      setLoading(false);
    }
  });
});
</script>
</body>
</html>
