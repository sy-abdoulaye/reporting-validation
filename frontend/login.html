<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Reporting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
<div id="toasts"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Reporting
      </div>
    </div>

    <h2>Bienvenue</h2>
    <p class="auth-sub">Connectez-vous à votre compte</p>

    <div id="login-error" class="alert alert-danger hidden" style="margin-bottom:1rem;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="login-error-msg"></span>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Nom d'utilisateur <span class="req">*</span></label>
        <input id="username" name="username" type="text" class="form-control"
               placeholder="votre_username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe <span class="req">*</span></label>
        <div style="position:relative">
          <input id="password" name="password" type="password" class="form-control"
                 placeholder="••••••••" autocomplete="current-password" required
                 style="padding-right:2.5rem">
          <button type="button" id="toggle-pw" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0;">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div style="text-align:right;margin-top:.5rem">
          <a href="forgot-password.html" class="text-sm">Mot de passe oublié ?</a>
        </div>
      </div>

      <button id="login-btn" type="submit" class="btn btn-primary w-full btn-lg" style="margin-top:.5rem">
        <span id="login-label">Se connecter</span>
        <span id="login-spin" class="spinner hidden" style="width:18px;height:18px;border-width:2px;border-color:rgba(255,255,255,.3);border-top-color:#fff;"></span>
      </button>
    </form>

    <div class="auth-footer">
      Pas encore de compte ? <a href="register.html">Créer un compte</a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  requireGuest();

  const form   = document.getElementById('login-form');
  const errBox = document.getElementById('login-error');
  const errMsg = document.getElementById('login-error-msg');
  const btn    = document.getElementById('login-btn');
  const lbl    = document.getElementById('login-label');
  const spin   = document.getElementById('login-spin');

  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  function setLoading(v) {
    btn.disabled = v;
    lbl.textContent = v ? 'Connexion…' : 'Se connecter';
    spin.classList.toggle('hidden', !v);
  }

  function showError(msg) {
    errMsg.textContent = msg;
    errBox.classList.remove('hidden');
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errBox.classList.add('hidden');
    setLoading(true);

    const body = new URLSearchParams({
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    });

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });
      const data = await res.json();
      if (!res.ok) {
        showError(fmtApiError(data));
        return;
      }
      Auth.save(data.access_token, data.refresh_token, data.user);
      window.location.href = 'index.html';
    } catch (err) {
      showError(err instanceof TypeError
        ? 'Impossible de joindre le serveur (port 8000).'
        : (err.message || 'Erreur inconnue.'));
    } finally {
      setLoading(false);
    }
  });
});
</script>
</body>
</html>
